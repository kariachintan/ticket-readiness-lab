name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest --cov=ticket_readiness --cov-report=term-missing
      - name: Smoke-test the offline demo
        run: |
          ticket-readiness review data/tickets/*.md
          ticket-readiness review data/tickets/vague-export.md --json > /dev/null
